<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JSYNQ · app</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #040405; font-family: Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  .mk { -webkit-mask: var(--src) center / contain no-repeat; mask: var(--src) center / contain no-repeat; background: var(--c, #fff); }
  .screen { position: fixed; inset: 0; width: 390px; height: 844px; overflow: hidden; }
  .wall { position: absolute; inset: 0; background: radial-gradient(120% 70% at 20% 0%, #29684C 0%, #153426 45%, #0B1510 75%, #040405 100%); }
  .wall .big { position: absolute; width: 520px; aspect-ratio: 1; left: -65px; top: 486px; --src: url(/jsynq-marca/assets/symbol-jsynq-white.svg); --c: rgba(255,255,255,.05); }
  .status { position: absolute; left: 0; right: 0; top: 0; height: 54px; display: flex; align-items: center; justify-content: space-between; padding: 14px 34px 0 42px; color: #fff; font: 600 16px Inter; z-index: 5; }
  .status .r { display: flex; gap: 6px; align-items: center; }
  .status .bat { width: 26px; height: 12px; border: 1.5px solid rgba(255,255,255,.7); border-radius: 4px; padding: 1.5px; }
  .status .bat i { display: block; height: 100%; width: 78%; background: #fff; border-radius: 1.5px; }
  .status .sig { display: flex; gap: 2px; align-items: flex-end; height: 12px; } .status .sig i { width: 3px; background: #fff; border-radius: 1px; }
  .grid { position: absolute; left: 26px; right: 26px; top: 90px; display: grid; grid-template-columns: repeat(4, 1fr); row-gap: 26px; justify-items: center; }
  .app { display: flex; flex-direction: column; align-items: center; gap: 7px; width: 72px; }
  .ico { width: 62px; height: 62px; border-radius: 15px; background: rgba(255,255,255,.12); box-shadow: inset 0 0 0 .5px rgba(255,255,255,.18); }
  .lbl { font: 500 11.5px Inter; color: rgba(255,255,255,.9); }
  .ph { width: 40px; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18); margin-top: 3px; }
  .jsq .ico { background: #45AD7E; display: grid; place-items: center; box-shadow: 0 6px 16px -4px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.25); }
  .jsq .ico i { width: 34px; height: 34px; --src: url(/jsynq-marca/assets/symbol-jsynq-white.svg); }
  .widget { grid-column: span 4; width: 100%; height: 150px; border-radius: 22px; background: rgba(255,255,255,.10); box-shadow: inset 0 0 0 .5px rgba(255,255,255,.18); padding: 18px 20px; color: #fff; position: relative; overflow: hidden; }
  .widget .hdr { display: flex; align-items: center; gap: 8px; font: 600 13px Inter; }
  .widget .hdr i { width: 16px; height: 16px; --src: url(/jsynq-marca/assets/symbol-jsynq-white.svg); --c: #45AD7E; }
  .widget h3 { margin-top: 16px; font: 700 22px/1.15 Inter; letter-spacing: -.01em; }
  .widget h3 em { font-style: normal; color: #8FCEB2; }
  .dock { position: absolute; left: 14px; right: 14px; bottom: 22px; height: 92px; border-radius: 32px; background: rgba(255,255,255,.12); display: flex; justify-content: space-around; align-items: center; padding: 0 12px; }
  .dots { position: absolute; left: 0; right: 0; bottom: 128px; display: flex; justify-content: center; gap: 8px; } .dots i { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,.35); } .dots i:first-child { background: #fff; }
  /* abertura do app */
  .splash { position: absolute; background: #45AD7E; overflow: hidden; z-index: 4; opacity: 0; }
  .splash .s { position: absolute; left: 50%; top: 50%; width: 120px; height: 120px; margin: -60px 0 0 -60px; --src: url(/jsynq-marca/assets/symbol-jsynq-white.svg); }
  .splash .w { position: absolute; left: 50%; bottom: 70px; width: 190px; aspect-ratio: 8948.57 / 1080; margin-left: -95px; --src: url(/jsynq-marca/assets/logo-jsynq-horizontal-white.svg); }
  .home { position: absolute; left: 50%; bottom: 8px; width: 140px; height: 5px; margin-left: -70px; border-radius: 3px; background: rgba(255,255,255,.85); z-index: 6; }
</style>
</head>
<body>
<div class="screen">
  <div class="wall"><div class="mk big"></div></div>
  <div class="status"><span>9:41</span><span class="r"><span class="sig"><i style="height:4px"></i><i style="height:6px"></i><i style="height:9px"></i><i style="height:12px"></i></span><span class="bat"><i></i></span></span></div>
  <div class="grid" id="grid">
    <div class="widget"><div class="hdr"><i class="mk"></i>JSYNQ Workspace</div><h3>Work smarter.<br><em>Stay in sync.</em></h3></div>
    <div class="app"><div class="ico"></div><div class="ph"></div></div>
    <div class="app jsq" id="jsq"><div class="ico" id="ico"><i class="mk"></i></div><div class="lbl">JSYNQ</div></div>
    <div class="app"><div class="ico"></div><div class="ph"></div></div>
    <div class="app"><div class="ico"></div><div class="ph"></div></div>
    <div class="app"><div class="ico"></div><div class="ph"></div></div>
    <div class="app"><div class="ico"></div><div class="ph"></div></div>
    <div class="app"><div class="ico"></div><div class="ph"></div></div>
    <div class="app"><div class="ico"></div><div class="ph"></div></div>
  </div>
  <div class="dots"><i></i><i></i><i></i></div>
  <div class="dock"><div class="ico"></div><div class="ico"></div><div class="ico"></div><div class="ico"></div></div>
  <div class="splash" id="splash"><div class="mk s"></div><div class="mk w"></div></div>
  <div class="home"></div>
</div>
<script>
  // Laço de 10 s: tela inicial, toque no ícone, o app abre (tela verde com o símbolo) e fecha.
  // Começa quando o gravador injeta :root{--run:running} (ou com ?play=1).
  const q = new URLSearchParams(location.search);
  const ico = document.getElementById("ico");
  const sp = document.getElementById("splash");
  const grid = document.getElementById("grid");
  const e = (x) => (1 - Math.cos(Math.PI * Math.min(1, Math.max(0, x)))) / 2;
  const out = (x) => 1 - Math.pow(1 - Math.min(1, Math.max(0, x)), 3);
  function set(t) {
    const r = ico.getBoundingClientRect();
    // 0..1: quanto o app está aberto
    let o = 0;
    if (t >= 3.0 && t < 3.7) o = out((t - 3.0) / 0.7);
    else if (t >= 3.7 && t < 6.6) o = 1;
    else if (t >= 6.6 && t < 7.3) o = 1 - e((t - 6.6) / 0.7);
    const press = t >= 2.4 && t < 3.0 ? Math.sin(Math.PI * (t - 2.4) / 0.6) : 0;
    ico.style.transform = `scale(${1 - 0.1 * press})`;
    ico.style.filter = `brightness(${1 - 0.25 * press})`;
    const L = r.left * (1 - o), T = r.top * (1 - o), W = r.width + (390 - r.width) * o, H = r.height + (844 - r.height) * o;
    sp.style.left = L + "px"; sp.style.top = T + "px"; sp.style.width = W + "px"; sp.style.height = H + "px";
    sp.style.borderRadius = 15 + (46 - 15) * o + "px";
    sp.style.opacity = o > 0 ? 1 : 0;
    const k = W / 390;
    sp.querySelector(".s").style.transform = `scale(${Math.max(0.28, k)})`;
    sp.querySelector(".w").style.opacity = Math.max(0, (o - 0.6) / 0.4);
    grid.style.transform = `scale(${1 + 0.06 * o})`;
    grid.style.opacity = 1 - 0.6 * o;
  }
  set(0);
  let t0 = null;
  const running = () => q.get("play") === "1" || getComputedStyle(document.documentElement).getPropertyValue("--run").trim() === "running";
  if (q.get("t")) set(Number(q.get("t")));
  else (function f(now) {
    if (t0 === null) { if (!running()) return requestAnimationFrame(f); t0 = now; }
    set(((now - t0) / 1000) % 10);
    requestAnimationFrame(f);
  })(performance.now());
</script>
</body>
</html>
